<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 250px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 14px;
        }

        h3 {
            margin: 0 0 10px 0;
            color: #333;
        }

        p {
            margin: 5px 0;
            color: #666;
            font-size: 12px;
            line-height: 1.4;
        }

        .shortcut {
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .shortcut-item {
            margin: 5px 0;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <h3>🔍 Regex Highlight & Search</h3>
    <p>The search UI appears on each page. Use it to:</p>
    <ul style="font-size: 12px; color: #666; margin: 10px 0; padding-left: 20px;">
        <li>Enter regex patterns</li>
        <li>Highlight all matches</li>
        <li>Navigate with Previous/Next</li>
    </ul>
    <div class="shortcut">
        <strong>Keyboard Shortcuts:</strong>
        <div class="shortcut-item">Ctrl/Cmd + F: Toggle widget (minimize if open, expand & focus if minimized)</div>
        <div class="shortcut-item">F3: Next match</div>
        <div class="shortcut-item">Shift + F3: Previous match</div>
    </div>
</body>

</html>
